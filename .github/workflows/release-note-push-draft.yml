name: Generate push release note draft

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate eligible draft
        id: draft
        run: node scripts/generate-push-release-note-draft.mjs "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/release-note-drafts"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload draft artifact
        if: steps.draft.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-note-draft-push-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.draft.outputs.draft_path }}
          if-no-files-found: error
          retention-days: 30
